aid: 99-counties
name: 99 Counties
description: >-
  99 Counties is a regenerative-agriculture meat company selling 100% grass-fed and
  grass-finished beef and bison, pasture-raised pork, poultry, and lamb, plus wild-caught
  seafood, sourced from small family farms across Iowa, Wisconsin, and Minnesota. Its
  Shopify storefront exposes an agent-native commerce surface implementing the Universal
  Commerce Protocol (UCP) over a published MCP endpoint, alongside Shopify Customer Account
  OAuth 2.0 / OpenID Connect and standard read-only product and collection JSON. It was
  surfaced through the API Evangelist VC-portfolio pipeline and enriched from its live
  public agent-commerce surfaces.
